name: Build Dimensionz DSi

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Inspect installed toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version || true
          find /opt/devkitpro -name '*.a'
          find /opt/devkitpro -name '*.specs'
          dkp-pacman -Q || true

      - name: Compile Dimensionz
        run: |
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$PATH"
          make clean
          make

      - uses: actions/upload-artifact@v4
        with:
          name: Dimensionz-DSi
          path: Dimensionz.nds
          if-no-files-found: error
