name: Build Dimensionz DSi

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile Dimensionz
        run: make

      - uses: actions/upload-artifact@v4
        with:
          name: Dimensionz-DSi
          path: "**/*.nds"
          if-no-files-found: error
